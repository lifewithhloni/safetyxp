name: SafetyXP cron scheduler

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "15 5 * * *"
    - cron: "30 5 * * *"
    - cron: "45 5 * * *"
    - cron: "*/15 * * * *"
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: Cron job to run
        required: true
        type: choice
        options:
          - all
          - daily-missions
          - risk-analysis
          - deadline-reminders
          - certificate-expiry
          - process-notifications
          - weekly-summary

jobs:
  daily-missions:
    name: Daily missions
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'daily-missions'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call daily missions endpoint
        env:
          SAFETYXP_CRON_SECRET: ${{ secrets.SAFETYXP_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SAFETYXP_CRON_SECRET:-}" ]]; then
            echo "::error::Repository secret SAFETYXP_CRON_SECRET is not configured."
            exit 1
          fi

          curl_exit=0
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --connect-timeout 10 \
            --max-time 120 \
            --header "x-cron-secret: ${SAFETYXP_CRON_SECRET}" \
            "https://app.safetyxp.co.za/api/cron/daily-missions")" || curl_exit=$?

          if [[ -z "$status" ]]; then status=000; fi
          printf 'Daily missions endpoint returned HTTP %s\n' "$status"
          if (( curl_exit != 0 )); then
            echo "::error::Daily missions request failed (curl exit ${curl_exit})."
            exit "$curl_exit"
          fi
          if [[ ! "$status" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Daily missions endpoint returned a non-2xx status."
            exit 1
          fi

  risk-analysis:
